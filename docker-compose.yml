version: '3.8'
services:
  postgres:
    image: postgres:16-alpine # Lightweight, fast-booting official Postgres image
    container_name: omnimind_postgres
    ports:
      - "5433:5432" # Maps the container port to your machine's port
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: omnimind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z # Using a stable long-term release
    container_name: omnimind_minio
    ports:
      - "9000:9000"       # ◄ MinIO S3 API Endpoint (For NestJS / FastAPI connections)
      - "9001:9001"       # ◄ MinIO Web Console Admin Panel (For browser access)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: